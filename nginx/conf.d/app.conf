# ─────────────────────────────────────────────────────────────────
# ETAPA 1 — HTTP (sin SSL, antes de tener dominio/certificado)
# Reemplaza DOMINIO_AQUI por tu dominio real antes de hacer deploy.
# Cuando tengas SSL, usa la configuración de la Fase 2 más abajo.
# ─────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name DOMINIO_AQUI www.DOMINIO_AQUI;

    # Para Let's Encrypt (obtener certificado)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}

