{% load static %}

<section class="relative py-24 bg-gradient-to-b from-slate-50 to-white overflow-hidden dot-pattern text-center">
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[400px] bg-brand-blue-100 rounded-full blur-3xl opacity-20 pointer-events-none"></div>

    <div class="relative z-10 max-w-4xl mx-auto px-6 reveal">
        <!-- Icono de Comillas -->
        <svg class="w-14 h-14 text-brand-blue-200 mx-auto mb-8" fill="currentColor" viewBox="0 0 24 24">
            <path d="M14.017 21L14.017 18C14.017 16.8954 14.9124 16 16.017 16H19.017C19.5693 16 20.017 15.5523 20.017 15V9C20.017 8.44772 19.5693 8 19.017 8H15.017C14.4647 8 14.017 8.44772 14.017 9V15C14.017 15.5523 14.4647 16 15.017 16H16.017C14.5583 16 13.5929 17.7039 13.0246 19L11.017 21V21ZM5.01765 21L5.01765 18C5.01765 16.8954 5.91243 16 7.01765 16H10.0177C10.5699 16 11.0177 15.5523 11.0177 15V9C11.0177 8.44772 10.5699 8 10.0177 8H6.01765C5.46537 8 5.01765 8.44772 5.01765 9V15C5.01765 15.5523 5.46537 16 6.01765 16H7.01765C5.55903 16 4.5936 17.7039 4.02525 19L2.01765 21V21Z"/>
        </svg>

        <!-- Cita -->
        <h3 class="text-2xl md:text-4xl font-light text-neutral-800 leading-tight mb-8 font-display">
            "Lo que no se mide, no se puede mejorar.<br>
            Lo que no se mejora, se <span class="text-brand-blue-600 font-bold">degrada siempre</span>."
        </h3>

        <!-- Autor -->
        <p class="text-xs font-black uppercase tracking-[0.4em] text-slate-400 font-display mb-12">
            — Lord Kelvin
        </p>

        <!-- CTA -->
        <a href="#contacto"
           class="group inline-flex items-center gap-3 px-8 py-4 bg-gradient-to-r from-brand-blue-600 to-brand-navy-900 text-white rounded-xl font-bold shadow-primary hover:shadow-primary-lg transition-all duration-300 hover:-translate-y-1 font-display">
            <span>Comienza a Medir tu Rentabilidad</span>
            <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
            </svg>
        </a>
    </div>
</section>
