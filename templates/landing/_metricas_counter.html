{% load static %}

<section class="relative bg-brand-navy-900 border-t border-white/5 dot-pattern-dark py-20 overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-r from-brand-blue-600/5 via-transparent to-brand-green-600/5 pointer-events-none"></div>

    <div class="relative z-10 max-w-7xl mx-auto px-6">
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-8 lg:gap-4">

            <div class="text-center reveal counter-item">
                <div class="text-5xl lg:text-6xl font-black font-mono bg-gradient-to-r from-brand-blue-400 via-brand-green-400 to-brand-amber-400 bg-clip-text text-transparent"
                     data-target="50" data-prefix="+" data-suffix="">0</div>
                <p class="text-sm text-slate-400 mt-2 uppercase tracking-wider font-display">PYMEs Transformadas</p>
            </div>

            <div class="text-center reveal counter-item" style="transition-delay:.1s">
                <div class="text-5xl lg:text-6xl font-black font-mono text-transparent bg-gradient-to-r from-brand-amber-400 to-brand-amber-300 bg-clip-text"
                     data-target="90" data-prefix="" data-suffix="d">0</div>
                <p class="text-sm text-slate-400 mt-2 uppercase tracking-wider font-display">ROI Promedio</p>
            </div>

            <div class="text-center reveal counter-item" style="transition-delay:.2s">
                <div class="text-5xl lg:text-6xl font-black font-mono text-transparent bg-gradient-to-r from-brand-green-400 to-brand-green-300 bg-clip-text"
                     data-target="4" data-prefix="" data-suffix="+">0</div>
                <p class="text-sm text-slate-400 mt-2 uppercase tracking-wider font-display">Años de Experiencia</p>
            </div>

            <div class="text-center reveal counter-item" style="transition-delay:.3s">
                <div class="text-5xl lg:text-6xl font-black font-mono text-transparent bg-gradient-to-r from-brand-blue-400 to-brand-blue-300 bg-clip-text"
                     data-target="98" data-prefix="" data-suffix="%">0</div>
                <p class="text-sm text-slate-400 mt-2 uppercase tracking-wider font-display">Tasa de Satisfacción</p>
            </div>

        </div>
    </div>
</section>
